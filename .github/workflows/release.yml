name: Release CLI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'var Version' cmd/keygoard/version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LDFLAGS="-X main.Version=${VERSION}"
          mkdir -p dist

          platforms=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output="keygoard"
            if [ "${GOOS}" = "windows" ]; then
              output="keygoard.exe"
            fi

            echo "Building ${GOOS}/${GOARCH}..."
            GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags "${LDFLAGS}" -o "${output}" ./cmd/keygoard

            archive_name="keygoard_v${VERSION}_${GOOS}_${GOARCH}"
            if [ "${GOOS}" = "windows" ]; then
              zip "dist/${archive_name}.zip" "${output}"
            else
              tar czf "dist/${archive_name}.tar.gz" "${output}"
            fi
            rm -f "${output}"
          done

      - name: Create tag and release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" dist/* \
            --title "keygoard ${TAG}" \
            --generate-notes
